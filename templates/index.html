<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <meta name="description"
          content="Expense Tracker is a full-stack web application for managing income, expenses, categories and financial balance.">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>
</head>

<body>

<div class="container">

    <!-- Header -->
    <header>

        <div>
            <h1>💰 Expense Tracker</h1>
            <p>Track your money. Control your spending.</p>
        </div>

        <div class="date" id="date"></div>

    </header>


    <!-- Navigation -->
    <nav class="navigation">

        <button class="nav-btn active" data-page="dashboard">
            🏠 Dashboard
        </button>

        <button class="nav-btn" data-page="add">
            ➕ Add Transaction
        </button>

        <button class="nav-btn" data-page="transactions">
            📋 Transactions
        </button>

    </nav>


    <!-- Dashboard Page -->
    <main id="dashboard" class="page active-page">

        <section class="summary">

            <div class="card income-card">
                <span>💵</span>
                <h3>Total Income</h3>
                <h2 id="totalIncome">₹0</h2>
            </div>

            <div class="card expense-card">
                <span>💸</span>
                <h3>Total Expenses</h3>
                <h2 id="totalExpense">₹0</h2>
            </div>

            <div class="card balance-card">
                <span>💰</span>
                <h3>Balance</h3>
                <h2 id="balance">₹0</h2>
            </div>

        </section>

    </main>


    <!-- Add Transaction Page -->
    <main id="add" class="page">

        <section class="form-section">

            <h2>Add Transaction</h2>

            <form id="expenseForm">

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        placeholder="Example: Grocery shopping"
                        required>

                </div>


                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="1"
                        required>

                </div>


                <div class="form-group">

                    <label for="type">
                        Type
                    </label>

                    <select id="type">

                        <option value="expense">
                            Expense
                        </option>

                        <option value="income">
                            Income
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category">

                        <option value="Food">🍔 Food</option>

                        <option value="Travel">🚗 Travel</option>

                        <option value="Shopping">🛍️ Shopping</option>

                        <option value="Education">📚 Education</option>

                        <option value="Bills">🧾 Bills</option>

                        <option value="Entertainment">
                            🎬 Entertainment
                        </option>

                        <option value="Other">📦 Other</option>

                    </select>

                </div>


                <button type="submit" class="add-btn">
                    + Add Transaction
                </button>

            </form>

        </section>

    </main>


    <!-- Transactions Page -->
    <main id="transactions" class="page">

        <section class="transactions">

            <div class="transaction-header">

                <h2>Recent Transactions</h2>

                <select id="filter">

                    <option value="all">
                        All Transactions
                    </option>

                    <option value="income">
                        Income
                    </option>

                    <option value="expense">
                        Expenses
                    </option>

                </select>

            </div>


            <div id="transactionList">

                <div class="empty-state">

                    <div class="empty-icon">
                        💳
                    </div>

                    <h3>No transactions yet</h3>

                    <p>
                        Add your first transaction to get started.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            Expense Tracker • Full Stack Project
        </p>

    </footer>

</div>


<script src="{{ url_for('static', filename='script.js') }}" defer></script>

</body>

</html>
